<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Refined Ahmadān banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#9b59ff"/>
      <stop offset="100%" stop-color="#ff5ca8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- subtle background shapes -->
  <g opacity="0.06" fill="#00e5ff">
    <circle cx="160" cy="260" r="120"/>
    <circle cx="1040" cy="100" r="90"/>
  </g>

  <!-- left card -->
  <g transform="translate(64 48)">
    <rect width="480" height="264" rx="20" fill="#071021" stroke="#081226"/>

    <text x="36" y="90" fill="#e9f3ff" font-size="44" font-family="Inter,Segoe UI,Roboto,Arial" font-weight="700">Ahmadān <tspan x="36" y="134" font-size="28" fill="#aeb8c7" font-weight="500">Syafiere</tspan></text>

    <text x="36" y="170" fill="#7ee7ff" font-size="14">Mahasiswa • Web Developer • UI/UX</text>

    <g transform="translate(36 190)">
      <rect width="110" height="30" rx="14" fill="#061122" stroke="#00e5ff" stroke-opacity="0.14"/>
      <text x="55" y="20" text-anchor="middle" fill="#00e5ff" font-size="12">Next.js</text>

      <rect x="136" width="110" height="30" rx="14" fill="#061122" stroke="#9b59ff" stroke-opacity="0.12"/>
      <text x="191" y="20" text-anchor="middle" fill="#c9b6ff" font-size="12">Tailwind</text>

      <rect x="272" width="110" height="30" rx="14" fill="#061122" stroke="#ff5ca8" stroke-opacity="0.12"/>
      <text x="327" y="20" text-anchor="middle" fill="#ffc0de" font-size="12">Figma</text>
    </g>
  </g>

  <!-- right visual: clean waveform + nodes -->
  <g transform="translate(660 48)" filter="url(#glow)">
    <rect width="420" height="264" rx="18" fill="#06101a" stroke="#081322"/>

    <path d="M30 200 C 110 120, 200 260, 280 150 S 430 60, 470 200" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" opacity="0.95"/>

    <circle cx="100" cy="120" r="6" fill="#00e5ff" opacity="0.95"/>
    <circle cx="230" cy="170" r="6" fill="#9b59ff" opacity="0.95"/>
    <circle cx="350" cy="110" r="6" fill="#ff5ca8" opacity="0.95"/>
  </g>
</svg>
