<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Ahmadhan Syafiere animated futuristic banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="50%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#0f1720"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#9b59ff"/>
      <stop offset="100%" stop-color="#ff5ca8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- abstract nodes -->
  <g fill="url(#neon)" opacity="0.08">
    <circle cx="90" cy="80" r="80"/>
    <circle cx="1100" cy="220" r="80"/>
    <circle cx="940" cy="60" r="60"/>
  </g>

  <!-- left card -->
  <g transform="translate(60 40)">
    <rect width="480" height="260" rx="22" fill="#070912" stroke="#0b1220" stroke-width="1"/>
    <rect x="20" y="22" width="160" height="42" rx="12" fill="#061222" stroke="#00f0ff" stroke-opacity="0.15"/>
    <text x="40" y="52" fill="#00f0ff" font-size="14" font-family="Inter,Segoe UI,Roboto,Arial">WEB DEVELOPER</text>

    <text x="30" y="120" fill="#e6eef8" font-size="42" font-family="Inter,Segoe UI,Roboto,Arial" font-weight="700">Ahmadān</text>
    <text x="30" y="162" fill="#aeb8c7" font-size="28" font-family="Inter,Segoe UI,Roboto,Arial">Syafiere</text>
    <text x="30" y="196" fill="#7ee7ff" font-size="14">Mahasiswa • Web Dev • UI/UX</text>

    <!-- tags -->
    <g transform="translate(30 220)">
      <rect width="110" height="30" rx="15" fill="#061222" stroke="#00f0ff" stroke-opacity="0.16"/>
      <text x="55" y="20" text-anchor="middle" fill="#00f0ff" font-size="12">Next.js</text>

      <rect x="130" width="110" height="30" rx="15" fill="#061222" stroke="#9b59ff" stroke-opacity="0.12"/>
      <text x="185" y="20" text-anchor="middle" fill="#c9b6ff" font-size="12">Tailwind</text>

      <rect x="260" width="110" height="30" rx="15" fill="#061222" stroke="#ff5ca8" stroke-opacity="0.12"/>
      <text x="315" y="20" text-anchor="middle" fill="#ffc0de" font-size="12">Figma</text>
    </g>
  </g>

  <!-- animated waveform area -->
  <g transform="translate(660 40)" filter="url(#glow)">
    <rect width="420" height="260" rx="20" fill="#06101a" stroke="#081322"/>
    <g>
      <path id="wave" d="M10 200 C 80 90, 160 260, 230 150 S 390 70, 410 200" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round"/>
      <use href="#wave" stroke="url(#neon)" stroke-width="6" opacity="0.15"/>
    </g>

    <!-- animated dots that pulse -->
    <circle cx="80" cy="100" r="6" fill="#00f0ff">
      <animate attributeName="r" values="6;10;6" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="140" r="5" fill="#9b59ff">
      <animate attributeName="r" values="5;9;5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="90" r="6" fill="#ff5ca8">
      <animate attributeName="r" values="6;11;6" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>

  </g>
</svg>
