<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Ahmadān Syafiere futuristic banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#070b17"/>
      <stop offset="50%" stop-color="#0d1323"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" x2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <g opacity="0.6">
    <circle cx="100" cy="80" r="2" fill="#67e8f9"/>
    <circle cx="150" cy="130" r="2" fill="#8b5cf6"/>
    <circle cx="210" cy="90" r="2" fill="#67e8f9"/>
    <circle cx="260" cy="140" r="2" fill="#f472b6"/>
    <circle cx="1040" cy="100" r="2" fill="#67e8f9"/>
    <circle cx="1090" cy="150" r="2" fill="#8b5cf6"/>
    <circle cx="1120" cy="110" r="2" fill="#67e8f9"/>
    <circle cx="860" cy="70" r="2" fill="#f472b6"/>
    <circle cx="920" cy="210" r="2" fill="#67e8f9"/>
    <circle cx="1040" cy="250" r="2" fill="#8b5cf6"/>
  </g>

  <g transform="translate(58 50)">
    <rect x="0" y="0" width="480" height="260" rx="26" fill="url(#card)" stroke="url(#stroke)" stroke-width="1.5"/>
    <rect x="26" y="26" width="150" height="46" rx="14" fill="#101827" stroke="#67e8f9" stroke-opacity="0.6"/>
    <text x="41" y="56" fill="#67e8f9" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="600">WEB DEV</text>

    <text x="30" y="120" fill="#f8fafc" font-size="42" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Ahmadān</text>
    <text x="30" y="165" fill="#cbd5e1" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="500">Syafiere</text>

    <text x="30" y="205" fill="#67e8f9" font-size="18" font-family="Segoe UI, Arial, sans-serif">Mahasiswa • Web Developer • UI/UX</text>

    <g transform="translate(30 225)">
      <rect x="0" y="0" width="116" height="28" rx="14" fill="#0f172a" stroke="#67e8f9" stroke-opacity="0.7"/>
      <text x="58" y="18" fill="#67e8f9" font-size="12" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Next.js</text>

      <rect x="130" y="0" width="96" height="28" rx="14" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.7"/>
      <text x="178" y="18" fill="#c4b5fd" font-size="12" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Tailwind</text>

      <rect x="240" y="0" width="88" height="28" rx="14" fill="#0f172a" stroke="#f472b6" stroke-opacity="0.7"/>
      <text x="284" y="18" fill="#f9a8d4" font-size="12" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Figma</text>
    </g>
  </g>

  <g transform="translate(650 48)" filter="url(#glow)">
    <rect x="0" y="0" width="420" height="260" rx="24" fill="#0b1220" stroke="url(#stroke)" stroke-width="1.5"/>
    <path d="M70 205 L200 70 L250 165 L330 90 L370 205 Z" fill="none" stroke="#67e8f9" stroke-width="3" opacity="0.9"/>
    <path d="M40 205 L150 140 L220 190 L315 130 L380 205" fill="none" stroke="#8b5cf6" stroke-width="2.5" opacity="0.9"/>
    <circle cx="210" cy="71" r="10" fill="#67e8f9"/>
    <circle cx="250" cy="165" r="9" fill="#f472b6"/>
    <circle cx="330" cy="90" r="8" fill="#8b5cf6"/>
    <circle cx="157" cy="139" r="8" fill="#67e8f9"/>
    <circle cx="315" cy="130" r="8" fill="#f472b6"/>
    <rect x="35" y="30" width="105" height="26" rx="8" fill="#0f172a" stroke="#67e8f9" stroke-opacity="0.7"/>
    <text x="87" y="48" fill="#67e8f9" font-size="13" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">PORTFOLIO</text>
  </g>
</svg>
